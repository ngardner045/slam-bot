services:
  realsense:
    build:
      context: ..
      dockerfile: docker/realsense.Dockerfile
    container_name: realsense
    network_mode: host
    privileged: true
    security_opt: ["seccomp:unconfined"]
    ipc: shareable
    shm_size: "1g"
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ./rs_params.yaml:/app/rs_params.yaml:ro
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=7
      - ROS_LOCALHOST_ONLY=0
      - REALSENSE_USB_BACKEND=libusb
    entrypoint: ["/ros_entrypoint.sh"]
    command:
      - bash
      - -lc
      - |
        source /opt/ros_ws/install/setup.bash;
        # base_link -> d455_link  (angles in RADIANS; 15° pitch = 0.261799)
        ros2 run tf2_ros static_transform_publisher \
            0.2281 0.0475 0.1532  0 0.261799 0  base_link d455_link &
        exec ros2 launch realsense2_camera rs_launch.py \
          camera_name:=d455 \
          config_file:=/app/rs_params.yaml
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc 'source /opt/ros_ws/install/setup.bash && for i in {1..10}; do ros2 topic list | grep -q ^/camera/d455/color/image_raw$ && exit 0; sleep 2; done; exit 1'"
        ]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30
  roboclaw:
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=7
      - ROS_LOCALHOST_ONLY=0
    security_opt: ["seccomp:unconfined"]
    ipc: "container:realsense"
    depends_on:
      realsense:
        condition: service_healthy
    build:
      context: ..
      dockerfile: docker/Dockerfile
    network_mode: host
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"
      - "/dev/input/event5:/dev/input/event5"
    volumes:
      - ../src/roboclaw_base_node.py:/app/roboclaw_base_node.py:ro
      - ../src/snapshot_recorder.py:/app/snapshot_recorder.py:ro
      - ../captures:/captures:rw
      - ./teleop.yaml:/app/teleop.yaml:ro
      - ./safety_params.yaml:/app/safety_params.yaml:ro
    command:
      - bash
      - -lc
      - |
        set -e
        source /opt/ros/humble/setup.bash
        # 1) Start the RoboClaw driver (background)
        python3 /app/roboclaw_base_node.py --ros-args \
          -p port:=/dev/ttyACM0 -p address:=0x80 \
          -p max_duty_frac:=0.8 -p v_full:=0.6 -p cmd_timeout:=2.0 \
          -r /cmd_vel:=/cmd_vel_safe &
        # 2) Start joy_node (background)
        ros2 run joy joy_node --ros-args \
          -p dev:=/dev/input/event5 -p autorepeat_rate:=20.0 -p deadzone:=0.05 &
        # 3) Snapshot Trigger (default Y=4; override with --ros-args -p y_button_index:=X)
        python3 /app/snapshot_recorder.py --ros-args --params-file /app/safety_params.yaml &
        # 4) Start teleop_twist_joy (foreground)
        #    (LB=6 deadman, RB=7 turbo; linear axis=1; yaw axis=0)
        ros2 run teleop_twist_joy teleop_node --ros-args --params-file /app/teleop.yaml
  safe_manual_driving:
    build:
      context: ..
      dockerfile: docker/Dockerfile      # same base image you use for roboclaw/snapshot_recorder
    container_name: safe_manual_driving
    network_mode: host
    ipc: "container:realsense"           # share IPC with the realsense container so TF topics are visible
    depends_on:
      realsense:
        condition: service_healthy
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=7
      - ROS_LOCALHOST_ONLY=0
    volumes:
      - ../src/safe_manual_driving.py:/app/safe_manual_driving.py:ro
      - ./safety_params.yaml:/app/safety_params.yaml:ro
    command:
      - bash
      - -lc
      - |
        set -e
        source /opt/ros/humble/setup.bash
        exec python3 /app/safe_manual_driving.py --ros-args --params-file /app/safety_params.yaml
    restart: unless-stopped